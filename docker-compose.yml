services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: seznam_skol
      POSTGRES_PASSWORD: seznam_skol
      POSTGRES_DB: seznam_skol
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seznam_skol -d seznam_skol"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
